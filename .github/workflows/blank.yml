name: Build ManicEMU TrollStoreJIT

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ManicEMU release tag"
        required: true
        default: "v2.0.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid

      # ------------------------------------------------------------
      # 1. Download official ManicEMU SideloadJIT IPA
      # ------------------------------------------------------------
      - name: Download ManicEMU
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          echo "Version: $VERSION"

          ASSET="ManicEMU.${VERSION}.SideloadJIT.ipa"

          URL="https://github.com/Manic-EMU/ManicEMU/releases/download/${VERSION}/${ASSET}"

          echo "Downloading:"
          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --output ManicEMU.ipa \
            "$URL"

          echo "===== Download complete ====="
          ls -lh ManicEMU.ipa

          echo "===== Verify IPA ====="
          unzip -t ManicEMU.ipa >/dev/null

          echo "IPA verification passed."

      # ------------------------------------------------------------
      # 2. Download TrollStoreJITEnabler source
      # ------------------------------------------------------------
      - name: Clone TrollStoreJITEnabler
        run: |
          git clone \
            https://github.com/Rednick16/TrollStoreJITEnabler.git

          cd TrollStoreJITEnabler

          # Pin currently known revision for reproducibility
          git checkout f1bc5186608b3248e614d6c8838a8332663d770c

      # ------------------------------------------------------------
      # 3. Compile TrollStoreJITEnabler as iOS arm64 dylib
      # ------------------------------------------------------------
      - name: Build TrollStoreJITEnabler
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -install_name "@executable_path/TrollStoreJITEnabler.dylib" \
            TrollStoreJITEnabler/entry.m \
            TrollStoreJITEnabler/utils.m \
            -o TrollStoreJITEnabler.dylib

          file TrollStoreJITEnabler.dylib
          otool -L TrollStoreJITEnabler.dylib

      # ------------------------------------------------------------
      # 4. Build insert_dylib
      # ------------------------------------------------------------
      - name: Build insert_dylib
        run: |
          set -euo pipefail

          git clone \
            https://github.com/tyilo/insert_dylib.git

          cd insert_dylib
          git checkout eb7278162af8fcc372e7f2946a2dee6a386b17d8

          xcodebuild \
            -project insert_dylib.xcodeproj \
            -scheme insert_dylib \
            -configuration Release \
            build

          cd ..

          INSERT_DYLIB="$(
            find ~/Library/Developer/Xcode/DerivedData \
              -type f \
              -path "*/Release/insert_dylib" \
              -perm +111 \
              | head -n 1
          )"

          if [ -z "$INSERT_DYLIB" ]; then
            echo "insert_dylib binary not found"
            exit 1
          fi

          cp "$INSERT_DYLIB" ./insert_dylib_bin
          chmod +x ./insert_dylib_bin

          ./insert_dylib_bin 2>&1 || true

# ------------------------------------------------------------
      # 5. Extract IPA and preserve original entitlements
      # ------------------------------------------------------------
      - name: Extract IPA
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p work
          cd work

          unzip -q ../ManicEMU.ipa

          APP="$(find Payload -maxdepth 1 -name '*.app' -type d | head -n 1)"

          if [ -z "$APP" ]; then
            echo "App bundle not found"
            exit 1
          fi

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist"
          )"

          EXEC="$APP/$EXEC_NAME"

          if [ ! -f "$EXEC" ]; then
            echo "Executable not found: $EXEC"
            exit 1
          fi

          printf 'APP=%s\n' "$APP" >> "$GITHUB_ENV"
          printf 'EXEC_NAME=%s\n' "$EXEC_NAME" >> "$GITHUB_ENV"

          echo "App: $APP"
          echo "Executable: $EXEC"

          echo "===== Original binary ====="
          file "$EXEC"

          echo "===== Extract original entitlements ====="
          ldid -e "$EXEC" > ../entitlements.plist

          if [ ! -s ../entitlements.plist ]; then
            echo "Failed to extract entitlements"
            exit 1
          fi

          plutil -lint ../entitlements.plist

          echo "===== Original entitlements ====="
          cat ../entitlements.plist

      # ------------------------------------------------------------
      # 6. Add TrollStore unsandbox entitlements
      # ------------------------------------------------------------
      - name: Patch entitlements
        run: |
          set -euo pipefail

          PLIST="entitlements.plist"

          if [ ! -f "$PLIST" ]; then
            echo "entitlements.plist not found"
            exit 1
          fi

          set_bool() {
            KEY="$1"
            VALUE="$2"

            /usr/libexec/PlistBuddy \
              -c "Delete :$KEY" \
              "$PLIST" \
              2>/dev/null || true

            /usr/libexec/PlistBuddy \
              -c "Add :$KEY bool $VALUE" \
              "$PLIST"
          }

          set_bool \
            "com.apple.private.security.container-required" \
            false

          set_bool \
            "com.apple.private.security.no-container" \
            true

          set_bool \
            "com.apple.private.security.no-sandbox" \
            true

          echo "===== Patched entitlements ====="
          plutil -lint "$PLIST"
          cat "$PLIST"

      # ------------------------------------------------------------
      # 7. Inject TrollStoreJITEnabler
      # ------------------------------------------------------------
      - name: Inject TrollStoreJITEnabler
        run: |
          set -euo pipefail

          cd work

          EXEC="$APP/$EXEC_NAME"
          DYLIB="$APP/TrollStoreJITEnabler.dylib"

          echo "App: $APP"
          echo "Executable: $EXEC"

          cp \
            ../TrollStoreJITEnabler.dylib \
            "$DYLIB"

          echo "===== Injecting dylib ====="

          ../insert_dylib_bin \
            --inplace \
            --strip-codesig \
            --all-yes \
            "@executable_path/TrollStoreJITEnabler.dylib" \
            "$EXEC"

          echo "===== Verify injected load command ====="

          if ! otool -L "$EXEC" | grep -F "TrollStoreJITEnabler.dylib"; then
            echo "TrollStoreJITEnabler injection failed"
            exit 1
          fi

          file "$DYLIB"

      # ------------------------------------------------------------
      # 8. Fake sign dylib and executable
      # ------------------------------------------------------------
      - name: Fake sign binaries
        run: |
          set -euo pipefail

          cd work

          EXEC="$APP/$EXEC_NAME"
          DYLIB="$APP/TrollStoreJITEnabler.dylib"

          echo "===== Sign injected dylib ====="
          ldid -S "$DYLIB"

          echo "===== Sign main executable ====="
          ldid -S../entitlements.plist "$EXEC"

          echo "===== Verify final entitlements ====="
          ldid -e "$EXEC"

          echo "===== Verify dylib ====="
          otool -L "$EXEC" | grep -F "TrollStoreJITEnabler.dylib"

      # ------------------------------------------------------------
      # 9. Repackage IPA
      # ------------------------------------------------------------
      - name: Package TrollStore IPA
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          cd work

          OUTPUT="../ManicEMU.${VERSION}.TrollStoreJIT.ipa"

          echo "===== Creating IPA ====="

          zip -qry "$OUTPUT" Payload

          cd ..

          if [ ! -f "ManicEMU.${VERSION}.TrollStoreJIT.ipa" ]; then
            echo "IPA creation failed"
            exit 1
          fi

          echo "===== Result ====="

          ls -lh "ManicEMU.${VERSION}.TrollStoreJIT.ipa"

          echo "===== Verify IPA ====="

          unzip -t "ManicEMU.${VERSION}.TrollStoreJIT.ipa" >/dev/null

          echo "Final IPA verification passed."

      # ------------------------------------------------------------

      # 10. Upload result

      # ------------------------------------------------------------

      - name: Upload TrollStore IPA

        uses: actions/upload-artifact@v4

        with:

          name: ManicEMU-${{ inputs.version }}-TrollStoreJIT

          path: ManicEMU.${{ inputs.version }}.TrollStoreJIT.ipa

          if-no-files-found: error

          retention-days: 30
